# Note: this pipelines is for the `shared-config` library

name: release
on:
  push:
    branches:
      - main

jobs:
  stable:
    uses: ./.github/workflows/release-stable.yml
    permissions:
      contents: write
      id-token: write
      pull-requests: write
      issues: write
    with:
      releaseScript: release
      nodeVersion: "22.23.4"
      packageManager: pnpm
    secrets:
      githubToken: ${{ secrets.GITHUB_TOKEN }}
      npmToken: ${{ secrets.NPM_TOKEN }}
